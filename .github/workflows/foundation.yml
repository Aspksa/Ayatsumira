name: Foundation checks
on:
  push:
    branches: [main, feature/hermes-integration-foundation, feature/hermes-upstream-import-tooling, feature/hermes-windows-preflight]
  pull_request:
jobs:
  static-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required foundation files
        shell: pwsh
        run: |
          $required = @('README.md','Start.bat','.gitignore','.env.example','docs/INTEGRATION.md','docs/SECURITY.md')
          foreach ($path in $required) { if (!(Test-Path -LiteralPath $path)) { throw "Missing $path" } }
      - name: Ensure local secrets and data are ignored
        shell: pwsh
        run: |
          $patterns = Get-Content .gitignore -Raw
          foreach ($item in @('data/','runtime/','backups/','.env')) {
            if (!$patterns.Contains($item)) { throw "Missing ignore rule: $item" }
          }
      - name: Validate launcher syntax without launching Hermes
        shell: pwsh
        run: |
          $bat = Get-Content Start.bat -Raw
          if (!$bat.Contains('DisableDelayedExpansion')) { throw 'Unsafe delayed expansion' }
          if (!$bat.Contains('127.0.0.1')) { throw 'Non-local default host' }
          if ($bat -match 'curl\s+.*\|\s*(bash|powershell)') { throw 'Untrusted bootstrap' }
      - name: Validate import tooling
        shell: pwsh
        run: ./scripts/Test-Layout.ps1
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @('scripts/Import-HermesWebUI.ps1','scripts/Test-Layout.ps1','scripts/Test-Runtime.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "Parse errors in $path : $($parseErrors -join '; ')" }
          }
      - name: Check preflight fails safely without runtime
        shell: pwsh
        run: |
          & ./scripts/Test-Runtime.ps1 -Quiet
          if ($LASTEXITCODE -ne 2) { throw "Expected missing-runtime exit code 2, got $LASTEXITCODE" }
